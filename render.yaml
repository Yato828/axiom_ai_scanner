# This production topology uses paid services. Deploy explicitly after reviewing the plans.
services:
  - type: keyvalue
    name: memorphia-state
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
  - type: web
    name: memorphia
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /api/health
    envVars:
      - key: MEMORPHIA_ENV
        value: production
      - key: MEMORPHIA_PUBLIC_ORIGIN
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: memorphia-state
          property: connectionString
  - type: worker
    name: memorphia-worker
    runtime: docker
    plan: 1c-2g
    dockerCommand: python -m memorphia_scanner.worker
    envVars:
      - key: MEMORPHIA_ENV
        value: production
      - key: WAVESPEED_API_KEYS
        sync: false
      - key: OPENAI_API_KEYS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: memorphia-state
          property: connectionString
